<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Ingestion Agent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 14px;
        }
        .upload-section {
            margin-bottom: 25px;
        }
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        input[type="file"] {
            display: none;
        }
        .file-label {
            display: block;
            padding: 15px;
            background: #f5f5f5;
            border: 2px dashed #667eea;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #667eea;
            font-weight: 500;
        }
        .file-label:hover {
            background: #667eea;
            color: white;
        }
        .file-name {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .info {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 25px;
            border-radius: 3px;
            font-size: 13px;
            color: #333;
            line-height: 1.6;
        }
        .info h3 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .info ul {
            margin-left: 20px;
        }
        .info li {
            margin-bottom: 4px;
        }
        .result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
        .result h4 {
            margin-bottom: 8px;
            font-size: 14px;
        }
        .result-content {
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            margin-top: 10px;
            color: #667eea;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Excel Ingestion Agent</h1>
            <p class="subtitle">Normalize test cases from Excel to JSON</p>
        </div>

        <form id="uploadForm">
            <div class="upload-section">
                <div class="file-input-wrapper">
                    <input type="file" id="fileInput" name="file" accept=".xlsx,.xls" required>
                    <label for="fileInput" class="file-label">
                        📁 Click to select Excel file or drag and drop
                    </label>
                    <div class="file-name" id="fileName"></div>
                </div>
            </div>

            <button type="submit" id="submitBtn">Upload & Process</button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div class="loading-text">Processing your file...</div>
        </div>

        <div class="result" id="result"></div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');

        // Handle file selection
        fileInput.addEventListener('change', function(e) {
            if (fileInput.files.length > 0) {
                fileName.textContent = '✓ ' + fileInput.files[0].name;
            } else {
                fileName.textContent = '';
            }
        });

        // Handle drag and drop
        const label = document.querySelector('.file-label');
        label.addEventListener('dragover', (e) => {
            e.preventDefault();
            label.style.background = '#667eea';
            label.style.color = 'white';
        });

        label.addEventListener('dragleave', () => {
            label.style.background = '#f5f5f5';
            label.style.color = '#667eea';
        });

        label.addEventListener('drop', (e) => {
            e.preventDefault();
            label.style.background = '#f5f5f5';
            label.style.color = '#667eea';
            fileInput.files = e.dataTransfer.files;
            if (fileInput.files.length > 0) {
                fileName.textContent = '✓ ' + fileInput.files[0].name;
            }
        });

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (fileInput.files.length === 0) {
                showError('Please select a file');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            loading.style.display = 'block';
            result.style.display = 'none';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                loading.style.display = 'none';
                submitBtn.disabled = false;

                if (response.ok && data.status === 'success') {
                    showSuccess(data);
                } else {
                    showError(data.message || 'An error occurred');
                }
            } catch (error) {
                loading.style.display = 'none';
                submitBtn.disabled = false;
                showError('Connection error: ' + error.message);
            }
        });

        function showSuccess(data) {
            result.className = 'result success';
            result.innerHTML = `
                <h4>✓ Success!</h4>
                <div class="result-content">
                    <p><strong>${data.message}</strong></p>
                    <p style="margin-top: 10px;">Output file: <code>${data.output_file}</code></p>
                    <p style="margin-top: 10px;"><strong>Test Cases Generated:</strong></p>
                    <pre style="background: rgba(0,0,0,0.05); padding: 10px; border-radius: 3px; overflow-x: auto; font-size: 11px;">${JSON.stringify(data.test_cases, null, 2).substring(0, 500)}...</pre>
                </div>
            `;
            result.style.display = 'block';
        }

        function showError(message) {
            result.className = 'result error';
            result.innerHTML = `
                <h4>✗ Error</h4>
                <div class="result-content">${message}</div>
            `;
            result.style.display = 'block';
        }
    </script>
</body>
</html>
